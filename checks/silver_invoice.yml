# DQX checks for the bronze_invoice to silver_invoice gate.
#
# Loaded by src/flow04/03_build_silver_invoice.py, which gets this file's path
# as the checks_path job parameter.
#
# An error row never reaches Silver, and the invoices that are fine are
# published rather than held back with it. The reason is recorded per row in
# the quarantine, so a rejected invoice is identifiable without reading a
# task's log.
#
# The fields are extracted by an LLM, so any of them can come back missing.
# That is what makes completeness the heart of this gate rather than a
# formality: the five below are the key, the date the invoice is reported
# under, and the three money columns.
#
# Not here, and deliberately: "matching seller/buyer" from the requirement's
# invoice gate. The PDFs carry the seller's name and tax id but no seller_id,
# so checking it means resolving against dim_seller — a business join that
# belongs in Gold.

# ── Completeness ──
- name: invoice_id_is_null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: invoice_id

- name: invoice_date_is_null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: invoice_date

- name: net_amount_is_null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: net_amount

- name: vat_amount_is_null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: vat_amount

- name: gross_amount_is_null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: gross_amount

# order_id, which FACT_INVOICE needs to join an invoice to its order and which
# gold_datamart_order_sales_detail needs to carry any invoice column at all. An
# invoice with no order id cannot reach the mart, which is the same reason the
# amounts above are errors rather than warnings.
#
# The foreign key rule at the end of this file cannot stand in for this one:
# foreign_key does not report a NULL, because a missing value is not a
# violation of integrity. Without this rule an invoice whose order id failed to
# extract passes the gate silently and shows up as an all-NULL column in the
# mart instead of a quarantine row.
- name: order_id_is_null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: order_id

# ── Uniqueness ──
# One row per invoice_id. The dedupe runs first, so this cannot fire for a
# non-null id; it documents the invariant and would catch a dedupe regression.
# nulls_distinct defaults to true, so rows whose id is missing are not reported
# as duplicates of each other — the completeness rule above owns those.
- name: invoice_id_is_not_unique
  criticality: error
  check:
    function: is_unique
    arguments:
      columns:
        - invoice_id

# ── Validity ──
# The requirement's own arithmetic: net + VAT = gross. All three are
# DECIMAL(18,2), so this is exact rather than approximate.
# An invoice whose totals do not add up is unusable for reporting, so error.
# A row with a missing amount makes the expression NULL and is not flagged
# here; the completeness rules above catch it instead.
- name: net_plus_vat_is_not_gross
  criticality: error
  check:
    function: sql_expression
    arguments:
      expression: net_amount + vat_amount = gross_amount
      msg: net_amount + vat_amount must equal gross_amount
      columns:
        - net_amount
        - vat_amount
        - gross_amount

# ── Referential integrity ──
# "valid order ID": the invoice has to bill an order that exists.
# warn rather than error, for the same reason the other gates' foreign keys are
# warnings — an invoice for an order that has not loaded yet is still a real
# invoice, and losing it would understate revenue.
- name: order_id_not_in_silver_order
  criticality: warn
  check:
    function: foreign_key
    arguments:
      columns:
        - order_id
      ref_columns:
        - order_id
      ref_df_name: silver_order

# ── Agreement with the order ──
# The arithmetic rule above compares the three amounts with each other, which
# holds at whatever scale they were read: a parse that turned '49,00' into 4900
# scales net, VAT and gross together, and 4900 + 1127 = 6027 still adds up. So
# that rule cannot see a misread of the number format, only an inconsistent
# one, and the amounts are extracted from text that arrives with a decimal
# comma and sometimes a currency attached.
#
# The order is the independent reference the invoice can be held against: an
# invoice bills one order, and its net amount is that order's amount. Comparing
# the two catches a misread whatever form it takes, including formats this gate
# has never seen, which is what an expression over the invoice's own columns
# cannot do.
#
# sql_query rather than compare_datasets: compare_datasets matches rows on the
# columns given and compares every column the two frames share, which here
# includes ingested_at — always different — so it would flag every invoice
# unless that column were excluded. It also matches on order_id, and two
# invoices may bill the same order. This query merges on invoice_id, which is
# unique, so each invoice is judged on its own.
#
# The query returns one row per invoice that joined; `condition` true means the
# check failed, and DQX joins the result back on merge_columns. An invoice
# whose order has not loaded yet does not join, gets no condition, and is not
# flagged — the same tolerance the foreign key above is set to, for the same
# reason.
#
# warn, not error: the two sides disagreeing does not say which one is wrong,
# and an invoice is the document of record for a sale that happened. Rejecting
# it would understate revenue to protect against a disagreement that may be the
# order's fault. A NULL amount makes the comparison NULL rather than true; the
# completeness rules above are what catch that.
- name: net_amount_differs_from_order
  criticality: warn
  check:
    function: sql_query
    arguments:
      merge_columns:
        - invoice_id
      query: |
        SELECT
            i.invoice_id,
            i.net_amount <> o.net_amount AS condition
        FROM {{ input_view }} AS i
        JOIN {{ silver_order }} AS o
          ON i.order_id = o.order_id
      msg: net_amount must equal the net amount of the order the invoice bills
