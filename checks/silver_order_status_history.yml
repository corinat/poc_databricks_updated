# DQX checks for the bronze_order_status_changes to silver_order_status_history
# gate, inside the order_status_history pipeline.
#
# Loaded by src/flow05/06_silver_order_status_history.py, which gets this
# file's path from the pipeline's checks_path configuration value.
#
# This feed is not a snapshot: several rows per order_id, one per status
# change, each with a sequence_num. So the rules are about the change events
# rather than about an order's current state.
#
# No uniqueness rule, and the reason is a runtime limit rather than a choice.
# is_unique is a dataset-level check implemented with an unbounded
# Window.partitionBy aggregation, and Spark does not support that on an
# append-mode streaming DataFrame — which is what this flow reads, because the
# AUTO CDC flow downstream needs a stream. A duplicate (order_id, sequence_num)
# would therefore have to be caught elsewhere; the CDC flow itself resolves it
# by sequence, keeping the last.
#
# foreign_key is also dataset-level, but it is an anti-join against a static
# reference, and a stream-static join is supported.

# ── Completeness ──
# The two columns the CDC flow is built on: KEYS (order_id) and
# SEQUENCE BY sequence_num. A row missing either cannot be applied at all.
- name: order_id_is_null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: order_id

- name: sequence_num_is_null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: sequence_num

# ── Validity ──
# The statuses this feed is known to carry. Quoted twice on purpose: is_in_list
# resolves a bare string as a column expression, so 'paid' is what makes it a
# literal.
# delivered appears here and nowhere in the order snapshot, which is why
# silver_order.status and this history can legitimately disagree.
# warn, not error: an unfamiliar status is still a real event in an order's
# history, and dropping it would leave a gap in the timeline.
- name: status_is_not_in_the_list
  criticality: warn
  check:
    function: is_in_list
    arguments:
      column: status
      allowed:
        - "'paid'"
        - "'shipped'"
        - "'cancelled'"
        - "'delivered'"

# ── Referential integrity ──
# A status change for an order that is not in silver_order.
# warn, as everywhere else: the order may simply not have loaded yet, and the
# change is still a real event.
- name: order_id_not_in_silver_order
  criticality: warn
  check:
    function: foreign_key
    arguments:
      columns:
        - order_id
      ref_columns:
        - order_id
      ref_df_name: silver_order
