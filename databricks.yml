# This is a Databricks asset bundle definition for dab_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: poc_project
  engine: direct

include:
  - resources/*.yml

variables:
  catalog:
    default: "poc_dev"
  dev_flag:
    default: true

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-4fa91c2f-fd86.cloud.databricks.com # replace with your Workspace URL
      profile: dev

  test:
    workspace:
      host: https://dbc-4fa91c2f-fd86.cloud.databricks.com
      profile: test
    variables:
      catalog: poc_test

  prod:
    workspace:
      host: https://dbc-4fa91c2f-fd86.cloud.databricks.com
      profile: prod
    variables:
      catalog: poc
