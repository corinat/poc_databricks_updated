# This is a Databricks asset bundle definition for dab_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: poc_project
  engine: direct

include:
  - resources/*.yml

variables:
  catalog:
    default: "poc_dev"
  # Runtime dependencies for the serverless jobs that run DQX, which is every
  # Bronze to Silver build. Declared here so the pinned version lives in one
  # place rather than in each job file. The version is pinned because DQX
  # documents breaking changes between releases.
  # type: complex is required: a variable whose default is a list.
  silver_job_dependencies:
    type: complex
    default:
      - databricks-labs-dqx==0.16.0
  dev_flag:
    default: true

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-4fa91c2f-fd86.cloud.databricks.com # replace with your Workspace URL
      profile: dev

  test:
    workspace:
      host: https://dbc-4fa91c2f-fd86.cloud.databricks.com
      profile: test
    variables:
      catalog: poc_test

  prod:
    workspace:
      host: https://dbc-4fa91c2f-fd86.cloud.databricks.com
      profile: prod
    variables:
      catalog: poc
