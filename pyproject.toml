[project]
name = "poc_databricks_01"
version = "0.0.1"
authors = [{ name = "corina_ww@yahoo.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
    "coverage==7.10.6",
    "databricks-connect==18.0.*",
    "googleapis-common-protos==1.70.0",
    "grpcio==1.74.0",
    "grpcio-status==1.74.0",
    "iniconfig==2.1.0",
    "numpy==2.3.2",
    "packaging==25.0",
    "pandas==2.3.2",
    "pluggy==1.6.0",
    "protobuf==6.32.0",
    "pyarrow==21.0.0",
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "six==1.17.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect==18.0",
    "ipykernel",
]

[project.scripts]
main = "poc_databricks_01.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
