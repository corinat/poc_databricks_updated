# resources/flow01_exchange_rate_job.job.yml
# Flow 01 — Job B: build_silver_exchange_rate
# Runs steps 2–4 of the flow.
# Trigger: table update trigger on bronze_currency. When Job A (load_bronze_currency)
# writes bronze_currency, this job starts automatically; no manual run needed.
# Note: dev mode pauses triggers by default; pause_status below keeps this one active in every target.

resources:
  jobs:
    build_silver_exchange_rate:
      name: build_silver_exchange_rate

      # Table update trigger: starts this job automatically whenever bronze_currency changes.
      trigger:
        pause_status: UNPAUSED
        table_update:
          table_names:
            - ${var.catalog}.${resources.schemas.bronze_raw.name}.bronze_currency

      # Job-level parameters: passed to every task, read in notebooks via dbutils.widgets.
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${resources.schemas.bronze_raw.name}
        - name: silver_schema
          default: ${resources.schemas.silver.name}
        - name: volume_name
          default: ${resources.volumes.input_data.name}

      tasks:
        # Step 2: Bronze view over the historical CSV.
        - task_key: create_bronze_exchange_rate_hist
          notebook_task:
            notebook_path: ../src/flow01/02_create_bronze_exchange_rate_hist.py
          environment_key: default

        # Step 3: does not need the view, only bronze_currency, so it runs in parallel with step 2.
        - task_key: load_bronze_exchange_rate_current
          notebook_task:
            notebook_path: ../src/flow01/03_load_bronze_exchange_rate_current.py
          environment_key: default

        # Step 4: needs both Bronze sources, so it runs after steps 2 and 3.
        - task_key: build_silver_exchange_rate
          depends_on:
            - task_key: create_bronze_exchange_rate_hist
            - task_key: load_bronze_exchange_rate_current
          notebook_task:
            notebook_path: ../src/flow01/04_build_silver_exchange_rate.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            # DQX, for the Bronze to Silver quality gate (flow 06).
            dependencies: ${var.silver_job_dependencies}
      queue:
        enabled: true
