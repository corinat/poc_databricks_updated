# resources/flow02_product_job.job.yml
# Flow 02 — Job A: load_bronze_product
# Trigger: file arrival on the products_excel folder of the volume, where every
# product delivery lands. A trigger path cannot contain a wildcard and the
# trigger has no extension filter, so scoping it to a folder of its own is what
# keeps unrelated uploads from starting this job.
# Note: dev mode pauses triggers by default; pause_status below keeps this one
# active in every target.

resources:
  jobs:
    load_bronze_product:
      name: load_bronze_product

      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/${var.catalog}/${resources.schemas.bronze_raw.name}/${resources.volumes.input_data.name}/data/products_excel/

      # Job-level parameters: passed to every task, read in notebooks via dbutils.widgets.
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${resources.schemas.bronze_raw.name}
        - name: volume_name
          default: ${resources.volumes.input_data.name}
        - name: silver_schema
          default: ${resources.schemas.silver.name}
        - name: gold_schema
          default: ${resources.schemas.gold.name}
        # DQX rules for the Bronze to Silver gate, and the directory of
        # src/common/dq.py which the gate notebook appends to sys.path.
        - name: checks_path
          default: ${workspace.file_path}/checks/silver_product.yml
        - name: common_path
          default: ${workspace.file_path}/src/common

      tasks:
        - task_key: load_bronze_product
          notebook_task:
            notebook_path: ../src/flow02/01_load_bronze_product.py
          environment_key: default

        # Build Silver from everything in Bronze. Runs only if the load
        # succeeded, so a delivery that failed is not silently left out.
        - task_key: build_silver_product
          depends_on:
            - task_key: load_bronze_product
          notebook_task:
            notebook_path: ../src/flow02/03_build_silver_product.py
          environment_key: default

        # Publish the dimension. Depends on Silver, so the projection is never
        # taken from a Silver table a failed quality gate left half-written.
        - task_key: build_gold_dim_product
          depends_on:
            - task_key: build_silver_product
          notebook_task:
            notebook_path: ../src/flow02/05_build_gold_dim_product.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            # DQX, for the Bronze to Silver quality gate.
            dependencies: ${var.silver_job_dependencies}
      queue:
        enabled: true
