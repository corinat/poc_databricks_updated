# resources/flow02_product_job.job.yml
# Flow 02 — Job A: load_bronze_product
# Trigger: file arrival on the data folder of the volume, where all sources are
# uploaded. A trigger path cannot contain a wildcard and the trigger has no
# extension filter, so this job starts on any upload to data/ — a CSV or a
# parquet file included. That is harmless: the notebook ingests with Auto
# Loader and a run that finds no new .xlsx writes nothing.
# Note: dev mode pauses triggers by default; pause_status below keeps this one
# active in every target.

resources:
  jobs:
    load_bronze_product:
      name: load_bronze_product

      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/${var.catalog}/${resources.schemas.bronze_raw.name}/${resources.volumes.input_data.name}/data/

      # Job-level parameters: passed to every task, read in notebooks via dbutils.widgets.
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${resources.schemas.bronze_raw.name}
        - name: volume_name
          default: ${resources.volumes.input_data.name}

      tasks:
        - task_key: load_bronze_product
          notebook_task:
            notebook_path: ../src/flow02/01_load_bronze_product.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            # No dependencies: the Excel reader is native to the runtime.
            environment_version: "6"
      queue:
        enabled: true
