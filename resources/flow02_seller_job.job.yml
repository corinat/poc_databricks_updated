# resources/flow02_seller_job.job.yml
# Flow 02 — Job B: load_bronze_seller
# Trigger: nightly schedule. The Delta folder is not pushed to, so there is no
# event to react to and the job polls instead.
# Note: dev mode pauses schedules by default; pause_status below keeps this one
# active in every target, so the trigger can be demonstrated in dev.

resources:
  jobs:
    load_bronze_seller:
      name: load_bronze_seller

      schedule:
        # 02:00 UTC every day. UTC does not observe daylight saving, so the run
        # keeps a fixed interval all year; in Europe/Warsaw this lands at 03:00
        # in winter and 04:00 in summer.
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED

      # Job-level parameters: passed to every task, read in notebooks via dbutils.widgets.
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${resources.schemas.bronze_raw.name}
        - name: volume_name
          default: ${resources.volumes.input_data.name}
        - name: silver_schema
          default: ${resources.schemas.silver.name}
        - name: gold_schema
          default: ${resources.schemas.gold.name}
        # DQX rules for the Bronze to Silver gate, and the directory of
        # src/common/dq.py which the gate notebook appends to sys.path.
        - name: checks_path
          default: ${workspace.file_path}/checks/silver_seller.yml
        - name: common_path
          default: ${workspace.file_path}/src/common

      tasks:
        - task_key: load_bronze_seller
          notebook_task:
            notebook_path: ../src/flow02/02_load_bronze_seller.py
          environment_key: default

        # Build Silver from everything in Bronze. Runs only if the load
        # succeeded, so a delivery that failed is not silently left out.
        - task_key: build_silver_seller
          depends_on:
            - task_key: load_bronze_seller
          notebook_task:
            notebook_path: ../src/flow02/04_build_silver_seller.py
          environment_key: default

        # Publish the dimension. Depends on Silver, so the projection is never
        # taken from a Silver table a failed quality gate left half-written.
        - task_key: build_gold_dim_seller
          depends_on:
            - task_key: build_silver_seller
          notebook_task:
            notebook_path: ../src/flow02/06_build_gold_dim_seller.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            # DQX, for the Bronze to Silver quality gate.
            dependencies: ${var.silver_job_dependencies}
      queue:
        enabled: true
